name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.5)'
        required: true
        type: string

permissions:
  contents: write

# E2（0.1.11）：同 tag 并发单飞——force-move/重跑同 tag 时自动取消旧 run，
# 避免同名 tag 双矩阵占 runner（不同 tag 互不阻塞）。v0.1.10 实测同一 tag
# 短时多 run 会重复占用 qemu/mac runner 加剧排队。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# 版本号 SSoT：tag 推送 → github.ref_name（如 v0.1.5）；workflow_dispatch →
# inputs.version 合成 v 前缀。全流程统一引用 env.VERSION，修复：
#   - 问题 4：workflow_dispatch 手动触发时 github.ref_name 为分支名而非 tag
#   - 问题 7：手动发布无需先打 tag，版本由输入唯一决定
env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', github.event.inputs.version) }}

jobs:
  # Linux x86-64：container ubuntu:20.04 保证 glibc 2.31 基线（覆盖
  # Ubuntu 20.04+/Debian 11+/Pi OS Bullseye+）。平台命名规范（0.1.10 起）：
  # OS-架构族-位宽（linux-x86-64 / linux-arm-64 …），下同；旧两代平台名由
  # manifest 别名覆盖（见 publish-release.sh ALIAS）。注意：GitHub Actions
  # 容器作业仅支持 Linux runner，macOS/Windows 必须拆分为独立作业（问题：
  # matrix 作业级 container 在 macos/windows runner 上报
  # "Container operation is only supported on Linux"）。
  build-linux-x86-64:
    runs-on: ubuntu-latest
    env:
      # E1 收口推广（0.1.11 P1）：x86-64 腿切预构建工具链镜像，与 arm-64
      # 腿同模式——host 只做检出/打包，项目构建全在镜像容器内完成。
      # 切换前实测 10.3min，其中 338s（55%）耗在每轮容器内从零准备依赖
      # （Install build dependencies 166s + lib-builddeps.sh 172s），项目
      # 本体编译仅 ~88s；镜像化后预期 ~4min（arm-64 腿同模式实证 1.6min）。
      # 镜像由 build-toolchain-images.yml 构建并 digest 钉版（Dockerfile
      # 与本腿原依赖准备同源，glibc 2.31 基线不变）；lib-builddeps.sh /
      # Dockerfile 变更后需重建镜像并 bump 此处引用（禁浮动 tag）。
      BUILD_DIR: build
      STAGE_DIR: stage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # 定向子模块检出（agent-workload 构建源 + tools 脚本）：不用
      # submodules:true —— 全量递归会拉 agent-linux/kernel（~2.5GB，构建
      # 用不到），且闭源子模块在 GitHub 不存在会使 checkout 整体失败。
      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      # 容器内完成 Configure→Build→Install→TUI→finalize 全链。
      # BUILD_DIR 在容器内覆盖为 /tmp/airy-build（BAN-33：构建目录必须在
      # 源码树外；host 侧 BUILD_DIR 仅保持变量形态，实际不使用）。
      # 完全体 finalize 在容器内执行：host 无 /usr/local 自编译库，host 侧
      # ldd 收集必 not found（对齐 arm-64 腿；.collected 不入包）。
      - name: Build in x86-64 container
        uses: ./.github/actions/lf-build-container
        with:
          image: ghcr.io/openairymax/agentrt-qemu-toolchain:amd64-20260906-1@sha256:99d3ac35030b3a19ef36277b443e011005224ee53b6187e8a60ca40b429def82
          platform: linux/amd64
          leg: x86-64
          envs: -e BUILD_DIR=/tmp/airy-build -e STAGE_DIR=stage
          script: |
            export DEBIAN_FRONTEND=noninteractive
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
            cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTS=OFF -DENABLE_SANITIZERS=OFF -DAIRY_BUILD_ALL=ON \
              -DOPENSSL_ROOT_DIR=/usr/local -DCMAKE_PREFIX_PATH=/usr/local \
              -DCMAKE_INSTALL_PREFIX="$PWD/$STAGE_DIR"
            cmake --build "$BUILD_DIR" -j"$(nproc)"
            cmake --install "$BUILD_DIR"
            # Rust TUI（SSoT：build-tui.sh 收敛 header 注入 + cargo 缺失兜底；
            # B1 fail-hard——x86-64 为门禁产品腿，TUI 属 REQUIRED_SUBTREE）
            AIRY_TUI_FAIL_HARD=1 bash /src/.github/scripts/build-tui.sh agent-workload/sdk/tui "$STAGE_DIR/bin"
            # Python 运行时依赖（完全体包 lib/，B1 fail-closed：子树缺失即腿失败，
            # 不再静默吞缺件——C2b/U11 教训，发布预检仅作兜底）
            bash /src/.github/scripts/copy-python-runtime.sh "$STAGE_DIR" \
              || { echo "::error::python 运行时四子树拷贝失败（lib/ 完整性必需）"; exit 1; }
            # 完全体 finalize：容器内收集运行时 .so + fail-closed 校验
            bash /src/.github/scripts/finalize-linux-libs.sh "$STAGE_DIR" /src/_tools

      # 打包：包内建 agentrt-<version> 顶层目录（install.sh 二进制模式按
      # agentrt-* 目录名匹配解压位置），platform 标记 + sha256 + upload
      # 由 lf-package 统一模板收敛（staging 由 cmake --install 创建，必存在，
      # 汇总 cp 硬失败防坏包）。
      - name: Package and upload (tar.gz)
        uses: ./.github/actions/lf-package
        with:
          version: ${{ env.VERSION }}
          platform-tag: x86-64
          artifact-suffix: linux-x86-64

  # macOS arm-64：原生 runner（无 container——容器作业仅支持 Linux）。
  # openssl/zlib/sqlite/curl 为 keg-only，需显式导出 pkg-config 路径。
  build-macos-arm-64:
    # E3 hosted runner 争抢治理（0.1.11）：mac 原生腿跨 workflow 共享
    # ci-macos-runner-bus（与 build-test macos-build 同组），串行不抢占，
    # 防 release/build-test 齐发把 mac 配额打满排队（cancel=false 公平等待）。
    concurrency:
      group: ci-macos-runner-bus
      cancel-in-progress: false
    runs-on: macos-latest
    env:
      # BAN-33：构建目录位于源码树外（工作区上级目录）
      BUILD_DIR: ../build
      STAGE_DIR: stage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      - name: Install build dependencies
        run: |
          brew install cmake ninja pkgconf sqlite cjson libyaml curl openssl zlib zstd \
            libmicrohttpd libwebsockets libevent nghttp2
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal

      - name: Configure
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix openssl)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig"
          # brew openssl 为 keg-only：libwebsockets.h 直接 #include <openssl/ssl.h>
          # 不经 pkg-config 的 TU 需要显式 -I/-L（CFLAGS/LDFLAGS 是
          # CMAKE_C_FLAGS / CMAKE_EXE_LINKER_FLAGS 的环境初值，全 target 生效）
          # arm64 Homebrew 头文件在 $(brew --prefix)/include，clang 不自动搜索，
          # 一并 -I（对齐 build-test.yml）。
          export CFLAGS="-I$(brew --prefix)/include -I$(brew --prefix openssl)/include"
          # Apple Silicon 默认不搜 /opt/homebrew/lib：gateway_d 链接
          # -lmicrohttpd 等裸库名需 -L$(brew --prefix)/lib（实证 run #2）。
          export LDFLAGS="-L$(brew --prefix)/lib -L$(brew --prefix openssl)/lib"
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DENABLE_SANITIZERS=OFF \
            -DAIRY_BUILD_ALL=ON \
            -DCMAKE_INSTALL_PREFIX="${{ env.STAGE_DIR }}"

      - name: Build
        run: |
          cmake --build ${{ env.BUILD_DIR }} --config Release --parallel

      - name: Install (aggregate bin/)
        run: |
          cmake --install ${{ env.BUILD_DIR }} --config Release

      - name: Deploy bootstrap script
        run: |
          if [ -f "_tools/scripts/ops/bin/agentrt-bootstrap.sh" ]; then
            cp -f "_tools/scripts/ops/bin/agentrt-bootstrap.sh" "${{ env.STAGE_DIR }}/bin/agentrt-bootstrap.sh"
            chmod 755 "${{ env.STAGE_DIR }}/bin/agentrt-bootstrap.sh"
          fi

      - name: Build TUI + copy Python runtime
        run: |
          # TUI 构建收敛共享脚本（airymax header 注入 + cargo + 部署，见
          # .github/scripts/build-tui.sh；B1 fail-hard——macOS 为门禁产品腿）
          AIRY_TUI_FAIL_HARD=1 bash .github/scripts/build-tui.sh agent-workload/sdk/tui "${{ env.STAGE_DIR }}/bin"
          # Python 运行时依赖（完全体包 lib/，B1 fail-closed）
          bash .github/scripts/copy-python-runtime.sh "${{ env.STAGE_DIR }}" \
            || { echo "::error::python 运行时四子树拷贝失败（lib/ 完整性必需）"; exit 1; }

      # G4/U6（0.1.13）：macOS dylib 自包含——otool -L 递归收集非系统 dylib 入
      # lib/，install_name_tool 重写为 @executable_path/../lib/，ad-hoc 重签，
      # fail-closed 校验（干净机无 brew 依赖亦可启动 daemon 群；工具脚本 SSoT
      # 见 _tools/scripts/ci/release/bundle-macos-dylibs.sh）。
      - name: Bundle macOS runtime dylibs (self-contained)
        run: bash _tools/scripts/ci/release/bundle-macos-dylibs.sh "${{ env.STAGE_DIR }}"

      # G4 验收代理（0.1.13）：干净机"可启"冒烟——逐个启动 bin/ Mach-O，要求
      # 无 dyld 加载失败（非系统依赖全部自包含）。托管 runner 为一次性干净 VM，
      # 是最强 CI 代理；工具脚本 SSoT 见 _tools/scripts/ci/release/smoke-macos-runtime.sh。
      - name: Smoke-run packaged daemons (clean-machine proxy)
        run: bash _tools/scripts/ci/release/smoke-macos-runtime.sh "${{ env.STAGE_DIR }}"

      # 打包：lf-package 统一模板（macOS 原生腿无 bootstrap 部署——
      # bin/agentrt-bootstrap.sh 为 Linux daemon 编排脚本）。
      - name: Package and upload (tar.gz)
        uses: ./.github/actions/lf-package
        with:
          version: ${{ env.VERSION }}
          platform-tag: arm-64
          artifact-suffix: macos-arm-64
          with-bootstrap: 'false'

  # macOS x86-64 (Intel)：macos-15-intel 原生 runner（0.1.10 并行发布决策：
  # macOS 三平台补全。build-macos-arm-64 跑 macos-latest=arm64，Intel 存量
  # 社区用户需 x86-64 包，故新增本 leg）。打包步骤与 arm-64 同构，仅
  # platform 标记与制品名不同。
  # runner 注意：macos-13 已于 2025-12-04 被 GitHub 退役（macos-15-intel
  # 为官方替代，支持至 2027-08；0.1.10 Release 实证 macos-13 标签 job 永
  # 远排队不分配 runner）。Intel runner 的 brew prefix 为 /usr/local，
  # Configure 步骤一律 $(brew --prefix) 动态解析，无需区分 prefix。
  build-macos-x86-64:
    # E3 修正（0.1.11，2026-09-05 实证）：macos-15-intel 与 macos-latest 分属
    # 不同物理 runner 池，无配额争抢。原与 build-macos-arm-64 共挤
    # ci-macos-runner-bus 触发 GitHub job 级 concurrency 同组互顶（后到 job
    # 取消先到 pending），dispatch run 实证 macos-x86-64 0 秒 cancelled。
    # 现用独立 intel 组（仅同一 run 内自洽），不复用 arm/latest 队列。
    # build-test macos-build（macos-latest）与 build-macos-arm-64 仍共享
    # ci-macos-runner-bus。
    concurrency:
      group: ci-macos-intel-runner-bus
      cancel-in-progress: false
    runs-on: macos-15-intel
    env:
      # BAN-33：构建目录位于源码树外（工作区上级目录）
      BUILD_DIR: ../build
      STAGE_DIR: stage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      - name: Install build dependencies
        run: |
          brew install cmake ninja pkgconf sqlite cjson libyaml curl openssl zlib zstd \
            libmicrohttpd libwebsockets libevent nghttp2
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal

      - name: Configure
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix openssl)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig"
          export CFLAGS="-I$(brew --prefix)/include -I$(brew --prefix openssl)/include"
          export LDFLAGS="-L$(brew --prefix)/lib -L$(brew --prefix openssl)/lib"
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DENABLE_SANITIZERS=OFF \
            -DAIRY_BUILD_ALL=ON \
            -DCMAKE_INSTALL_PREFIX="${{ env.STAGE_DIR }}"

      - name: Build
        run: |
          cmake --build ${{ env.BUILD_DIR }} --config Release --parallel

      - name: Install (aggregate bin/)
        run: |
          cmake --install ${{ env.BUILD_DIR }} --config Release

      - name: Deploy bootstrap script
        run: |
          if [ -f "_tools/scripts/ops/bin/agentrt-bootstrap.sh" ]; then
            cp -f "_tools/scripts/ops/bin/agentrt-bootstrap.sh" "${{ env.STAGE_DIR }}/bin/agentrt-bootstrap.sh"
            chmod 755 "${{ env.STAGE_DIR }}/bin/agentrt-bootstrap.sh"
          fi

      - name: Build TUI + copy Python runtime
        run: |
          # TUI 构建收敛共享脚本（airymax header 注入 + cargo + 部署，见
          # .github/scripts/build-tui.sh；B1 fail-hard——macOS 为门禁产品腿）
          AIRY_TUI_FAIL_HARD=1 bash .github/scripts/build-tui.sh agent-workload/sdk/tui "${{ env.STAGE_DIR }}/bin"
          # Python 运行时依赖（完全体包 lib/，B1 fail-closed）
          bash .github/scripts/copy-python-runtime.sh "${{ env.STAGE_DIR }}" \
            || { echo "::error::python 运行时四子树拷贝失败（lib/ 完整性必需）"; exit 1; }

      # G4/U6（0.1.13）：macOS dylib 自包含（同 arm-64 腿，SSoT 见
      # _tools/scripts/ci/release/bundle-macos-dylibs.sh）
      - name: Bundle macOS runtime dylibs (self-contained)
        run: bash _tools/scripts/ci/release/bundle-macos-dylibs.sh "${{ env.STAGE_DIR }}"

      # G4 验收代理（同 arm-64 腿，SSoT 见 smoke-macos-runtime.sh）
      - name: Smoke-run packaged daemons (clean-machine proxy)
        run: bash _tools/scripts/ci/release/smoke-macos-runtime.sh "${{ env.STAGE_DIR }}"

      # 打包：lf-package 统一模板（macOS 原生腿无 bootstrap 部署）。
      - name: Package and upload (tar.gz)
        uses: ./.github/actions/lf-package
        with:
          version: ${{ env.VERSION }}
          platform-tag: x86-64
          artifact-suffix: macos-x86-64
          with-bootstrap: 'false'

  # Windows x64：原生 runner（无 container）。vcpkg 已预装于
  # windows-latest（$env:VCPKG_INSTALLATION_ROOT）。zip 包必须与 tar.gz 包
  # 保持完全体一致（config 模板 + permission_rules + maths-toolkit +
  # platform 标记），防止 Windows 包缺失组件（问题：打包漂移）。
  build-windows-x86-64:
    # G1 升 gate（2026-09-07，0.1.13 清零）：daemons 15 + airy_cli + TUI +
    # python 运行时已随各 wave 移植且编译全绿（wave-11b 起连续多轮全绿；
    # MSVC ctest 自 35 项 SegFault 收敛至全绿 = G2，build-test windows-build
    # 已恢复 required 门禁，6fdf90da4）；本腿脱离 P27 canary——tag/dispatch
    # 均入发布矩阵，zip 经 release 聚合进入 publish REQUIRED_BIN/SUBTREE
    # 预检（即 G1 出口实证：任一 daemon/CLI/TUI/python 缺失即中止发布）。
    # 用户裁决：0.1.13 Windows 必须完整。
    # E3：与 build-test windows-build 共享 ci-windows-runner-bus，防 MSVC 腿
    # 双 workflow 并跑占满 windows hosted 配额。
    concurrency:
      group: ci-windows-runner-bus
      cancel-in-progress: false
    runs-on: windows-latest
    # gate 语义：构建失败/zip 不完整即本腿失败（B1 同口径，不再静默缺件）。
    continue-on-error: false
    env:
      # BAN-33：构建目录位于源码树外（工作区上级目录）
      BUILD_DIR: ../build
      STAGE_DIR: stage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Init submodules (agent-workload, tools)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      # E4：vcpkg 二进制缓存恢复（restore 于 install 之前；key 随本 workflow
      # 内容失效并回退前缀 key；vcpkg classic 模式加性缓存天然正确）
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-cache-${{ runner.os }}-release-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            vcpkg-cache-${{ runner.os }}-

      - name: Install build dependencies
        shell: pwsh
        # E4：vcpkg 二进制缓存。runner.temp 只能在 step 级 env 解析（job 级 env
        # 无 runner context，GitHub 判整个 workflow 无效——0.1.11 实证）。
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ runner.temp }}/vcpkg-cache,readwrite"
        run: |
          # vcpkg 包名：curl（非 libcurl）、libmicrohttpd/libwebsockets（带 lib- 前缀）
          vcpkg install sqlite3 cjson libyaml curl openssl zlib libmicrohttpd libwebsockets libevent nghttp2 --triplet x64-windows
          # Rust 工具链（agentrt-tui 完全体包组件）
          Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile "$env:TEMP\rustup-init.exe"
          & "$env:TEMP\rustup-init.exe" -y --profile minimal --default-toolchain stable

      - name: Configure
        shell: pwsh
        # G1 stage-1（0.1.13）：本 canary 显式 opt-in daemons(15)/CLI，把
        # MSVC 编译+链接错误列表作为 Windows 完整产品移植的 triage 数据集
        #（错误 → 修复 → 提交，随 release dispatch 回归）；默认矩阵不变。
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTS=OFF `
            -DENABLE_SANITIZERS=OFF `
            -DAIRY_BUILD_ALL=ON `
            -DBUILD_DAEMON=ON -DBUILD_CLI=ON `
            -DCMAKE_INSTALL_PREFIX="${{ env.STAGE_DIR }}"

      - name: Build
        shell: pwsh
        run: |
          # MSVC 编译失败时把错误以 ::error:: 上报为 annotation（日志下载需
          # admin，annotation 匿名 API 可读）。警告洪流会淹没真实错误且 GH
          # annotation 有长度限制：优先筛出 error C*/LNK*/fatal 行，无错误行
          # 时才回退到日志尾部。合并为单条多行消息。
          $buildLog = Join-Path $env:RUNNER_TEMP "build.log"
          cmake --build ${{ env.BUILD_DIR }} --config Release --parallel 2>&1 | Tee-Object -FilePath $buildLog
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content $buildLog
            # C2220 的前一行即被升级的 warning（含真实告警码），一并纳入
            $errIdx = 0..($lines.Count - 1) | Where-Object { $lines[$_] -match ': error |error C[0-9]+|fatal error|error LNK[0-9]+' }
            $errs = foreach ($i in $errIdx) { $lines[[Math]::Max(0, $i - 1)..$i] }
            $tail = if ($errs) { $errs | Select-Object -Last 60 } else { $lines | Select-Object -Last 60 }
            $msg = ("MSVC build failed (exit {0})`n{1}" -f $LASTEXITCODE, ($tail -join "`n"))
            if ($msg.Length -gt 60000) { $msg = $msg.Substring($msg.Length - 60000) }
            $msg = $msg.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error::$msg"
            exit $LASTEXITCODE
          }

      - name: Install (aggregate bin/)
        run: |
          cmake --install ${{ env.BUILD_DIR }} --config Release

      - name: Build TUI + copy Python runtime
        shell: pwsh
        env:
          # build.rs 依赖 airy_run_stream.h（v0.1.10 事故在 Windows 的复现：
          # #50 rc4 实证 "run_stream schema header not found"——本步骤此前绕开
          # build-tui.sh SSoT 且未设 env，build.rs 默认相对路径按伞仓布局
          # 找不到 header → cargo panic → TUI 缺失 + 步骤 exit 1)。显式注入
          # checkout 直布局路径（与 Linux/macOS build-tui.sh L30 同源）。
          AGENTRT_TUI_RUN_STREAM_H: ${{ github.workspace }}/commons/include/airy_run_stream.h
        run: |
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          $env:CARGO_TARGET_DIR = "$env:RUNNER_TEMP\tui-target"
          Push-Location "agent-workload/sdk/tui"
          & cargo build --release
          if ($LASTEXITCODE -ne 0) { throw "[windows] TUI 构建失败（exit $LASTEXITCODE，bin/agentrt-tui.exe 发布完整性必需）" }
          Pop-Location
          if (Test-Path "$env:CARGO_TARGET_DIR\release\agentrt-tui.exe") {
            Copy-Item "$env:CARGO_TARGET_DIR\release\agentrt-tui.exe" "${{ env.STAGE_DIR }}\bin\" -Force
          } else { throw "[windows] TUI 产物缺失: $env:CARGO_TARGET_DIR\release\agentrt-tui.exe" }
          New-Item -ItemType Directory -Path "${{ env.STAGE_DIR }}\lib" -Force | Out-Null
          foreach ($p in @("agent-workload/ecosystem/agents/airymax_agents","agent-workload/ecosystem/agents/airymax_agents_rs","agent-workload/ecosystem/agents/orchestration","agent-workload/sdk/sdk-python/agentrt")) {
            if (-not (Test-Path $p)) { throw "[windows] python 运行时子树缺失: $p" }
            Copy-Item -Path $p -Destination "${{ env.STAGE_DIR }}\lib\" -Recurse -Force
          }

      # zip 包与 tar.gz 完全体一致（install.ps1 二进制模式依赖 config 模板）。
      - name: Package (zip)
        shell: pwsh
        run: |
          $VERSION = "${{ env.VERSION }}"; $VERSION_NUM = $VERSION.TrimStart('v')
          $pkgDir = "pkg\agentrt-$VERSION_NUM"
          New-Item -ItemType Directory -Path "$pkgDir\config" -Force | Out-Null
          New-Item -ItemType Directory -Path "$pkgDir\modules" -Force | Out-Null
          Copy-Item -Path "${{ env.STAGE_DIR }}\*" -Destination "$pkgDir\" -Recurse -Force
          foreach ($cfg in @("agent-workload\ecosystem\manager\configs\agentrt.yaml","agent-workload\ecosystem\manager\model\model.yaml","_tools\scripts\ops\templates\secrets.env.example","_tools\scripts\ops\templates\permission_rules.yaml")) {
            if (Test-Path $cfg) { Copy-Item -Path $cfg -Destination "$pkgDir\config\" -Force }
          }
          if (Test-Path "agent-workload\ecosystem\markets\tools\maths-toolkit") {
            Copy-Item -Path "agent-workload\ecosystem\markets\tools\maths-toolkit" -Destination "$pkgDir\modules\" -Recurse -Force
          }
          if (Test-Path "_tools\scripts\ops\bin\agentrt-bootstrap.sh") {
            Copy-Item -Path "_tools\scripts\ops\bin\agentrt-bootstrap.sh" -Destination "$pkgDir\bin\" -Force
          }
          New-Item -ItemType File -Path "$pkgDir\platform-x86-64" -Force | Out-Null
          $artifact = "agentrt-$VERSION-windows-x86-64"
          Compress-Archive -Path "pkg\*" -DestinationPath "$artifact.zip"
          # 校验和（Windows 无 sha256sum，用 Get-FileHash）
          (Get-FileHash -Algorithm SHA256 "$artifact.zip").Hash.ToLower() + "  $artifact.zip" | Out-File -FilePath "$artifact.zip.sha256"
          "artifact_name=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: ${{ env.artifact_name }}.*
          if-no-files-found: error

  # RISC-V (linux-riscv64)：标准 runner 无 riscv64 第三方库（libcurl 等），
  # 经 Docker buildx + qemu 多架构容器构建（ubuntu:20.04 riscv64 镜像，
  # 与 x86-64/arm-64 统一 glibc 2.31 基线）。
  build-linux-riscv-64:
    # CI 收敛（2026-09-04）：QEMU riscv64 在托管 runner 上 6h 内无法完成
    #（R15 5h52m+ / R16 均被强杀），tag 自动发布不再触发，避免 workflow
    # 僵尸挂起数小时；仅 workflow_dispatch 显式请求时尝试。linux-riscv-64
    # 完整制品由本地构建台 build.sh 交叉补发（与 release.needs 摘除同一决策）。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 并行发布决策（2026-09-04）：QEMU 交叉编译在托管 runner 上持续撞 6h
    # 单 job 硬上限（R15 5h52m+ 仍 in_progress，被强制终止），无法作为
    # v0.1.9 门禁。改 continue-on-error：仍尝试产出 riscv-64 制品，但不再
    # 阻断发布；linux-riscv-64 完整制品改由本地/自托管构建补发（见 release.needs）。
    continue-on-error: true
    env:
      BUILD_DIR: build
      STAGE_DIR: stage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # 宿主机完成定向检出后再 docker run（-v "$PWD":/src 挂载需含
      # agent-workload/ 与 tools/）
      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build in riscv64 container
        uses: ./.github/actions/lf-build-container
        with:
          # riscv64 无专用工具链镜像（已知例外：ubuntu:20.04 非 digest 钉版，
          # 镜像化记后续工程），QEMU 全模拟。
          image: ubuntu:20.04
          platform: linux/riscv64
          leg: riscv64
          envs: -e BUILD_DIR=/tmp/airy-build -e STAGE_DIR=stage
          script: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq \
              build-essential make perl curl python3 python3-pip \
              libsqlite3-dev libyaml-dev libcurl4-openssl-dev \
              libssl-dev zlib1g-dev libzstd-dev libmicrohttpd-dev \
              libwebsockets-dev libevent-dev libnghttp2-dev
            # 0.1.6f SSoT：cmake/cJSON/OpenSSL/libcurl/libwebsockets 自编译
            # 收敛到 lib-builddeps.sh（与本地 build.sh / build-linux-x86-64 同源，
            # 幂等 + 离线 deps 缓存优先）。统一 libssl.so.3 链路。
            bash /src/_tools/scripts/ci/release/lib-builddeps.sh
            # Rust 工具链仅供 agentrt-tui 构建。riscv64 为 canary 载体
            #（B10 2026-09-07 用户裁决：RISC-V 0.1.13 不发制品），TUI 降级
            # 可接受；qemu 模拟下 rustup-init 偶发失败（run #14 rc=127）
            # 重试 3 次后仍失败则告警降级，不阻塞其余六平台门禁。
            if ! (curl --proto '=https' --tlsv1.2 -sSf --retry 3 https://sh.rustup.rs | sh -s -- -y --profile minimal); then
              echo "warn: rustup 安装失败，agentrt-tui 将缺失（riscv64 canary 降级继续）"
            fi
            export PATH="$HOME/.cargo/bin:$PATH"
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
            cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTS=OFF -DENABLE_SANITIZERS=OFF -DAIRY_BUILD_ALL=ON \
              -DOPENSSL_ROOT_DIR=/usr/local -DCMAKE_PREFIX_PATH=/usr/local \
              -DCMAKE_INSTALL_PREFIX="$PWD/$STAGE_DIR"
            cmake --build "$BUILD_DIR" -j"$(nproc)"
            cmake --install "$BUILD_DIR"
            # Rust TUI（agentrt-tui），失败降级不阻断。riscv64 链接陷阱：
            # GNU ld 2.34 无法合并 RISC-V attributes（libc build script 即
            # 失败）；与本地 _tools/scripts/ci/release/build.sh 同源修复——
            # rust-lld 复制为 ld.lld，gcc driver 保留库路径，-fuse-ld=lld
            # 仅换链接器。
            export PATH="$HOME/.cargo/bin:$PATH"
            export CARGO_TARGET_DIR=/tmp/tui-target
            # build.rs 需 airy_run_stream.h（v0.1.10 回归：伞仓相对路径失效）
            export AGENTRT_TUI_RUN_STREAM_H="$PWD/commons/include/airy_run_stream.h"
            RUST_LLD="$(find "$HOME/.rustup" -name rust-lld -path '*riscv64*' 2>/dev/null | head -1)"
            if [ -n "$RUST_LLD" ]; then cp -f "$RUST_LLD" /usr/local/bin/ld.lld; chmod +x /usr/local/bin/ld.lld; fi
            if ! (cd agent-workload/sdk/tui && RUSTFLAGS="-C link-arg=-fuse-ld=lld" cargo build --release); then
              echo "warn: riscv64 TUI 构建失败（降级）"
            else
              cp -f /tmp/tui-target/release/agentrt-tui "$STAGE_DIR/bin/" 2>/dev/null || true
            fi
            # Python 运行时依赖（完全体包 lib/，B1 fail-closed）
            bash /src/.github/scripts/copy-python-runtime.sh "$STAGE_DIR" \
              || { echo "::error::python 运行时四子树拷贝失败（lib/ 完整性必需）"; exit 1; }
            # 完全体 finalize：容器内收集运行时 .so + fail-closed 校验（host
            # 无 /usr/local 自编译库，收集必 not found；.collected 不入包）
            bash /src/.github/scripts/finalize-linux-libs.sh "$STAGE_DIR" /src/_tools

      # 打包：包内建 agentrt-<version> 顶层目录（install.sh 二进制模式按
      # agentrt-* 目录名匹配解压位置），platform 标记 + sha256 + upload
      # 由 lf-package 统一模板收敛（staging 由 cmake --install 创建，必存在，
      # 汇总 cp 硬失败防坏包）。
      - name: Package and upload (tar.gz)
        uses: ./.github/actions/lf-package
        with:
          version: ${{ env.VERSION }}
          platform-tag: riscv-64
          artifact-suffix: linux-riscv-64

  # ARM-64 (linux-arm-64)：0.1.11 E1-B——原生 arm64 hosted runner
  # （ubuntu-24.04-arm，公开仓库免费）执行，容器内 ubuntu:20.04 arm64
  # 镜像在原生 arm64 上**零 QEMU 模拟**，glibc 2.31 基线不变（覆盖 arm-64 /
  # arm-32 设备）。实测 qemu 腿 88min → 预期 ~15min（2026-09-05，qemu
  # 全模拟 + 每轮自编 deps 主导耗时）。
  build-linux-arm-64:
    runs-on: ubuntu-24.04-arm
    env:
      BUILD_DIR: build
      STAGE_DIR: stage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # 宿主机完成定向检出后再 docker run（-v "$PWD":/src 挂载需含
      # agent-workload/ 与 tools/）
      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      # 原生 arm64 runner：无需 Set up QEMU / buildx（x86_64 时代残留）。
      # docker run --platform linux/arm64 在 arm64 宿主上原生执行。

      - name: Build in arm-64 container
        uses: ./.github/actions/lf-build-container
        with:
          # E1 收口（2026-09-05）：预构建工具链镜像（GHCR 公开，digest 钉版）。
          # apt 依赖 + lib-builddeps 自编译产物已固化进镜像（Dockerfile 与
          # release 腿同源，glibc 2.31 基线不变），本腿只做项目构建/打包——
          # 省去每轮 apt + 源码重编 deps（原生 arm64 下进一步压缩墙钟）。
          image: ghcr.io/openairymax/agentrt-qemu-toolchain:arm64-20260906-1@sha256:598a269f97744d81d80c67ffd7516f7f79ad33b8bc904346a56a5c31d3dbc146
          platform: linux/arm64
          leg: arm-64
          envs: -e BUILD_DIR=/tmp/airy-build -e STAGE_DIR=stage
          script: |
            export DEBIAN_FRONTEND=noninteractive
            # Rust 工具链仅供 agentrt-tui 构建（arm-64 门禁产品腿，TUI 属
            # REQUIRED_SUBTREE，0.1.13 #11 起发布必检）；rustup 安装失败时
            # 下方 cargo 步骤将 fail-closed，不降级。
            if ! (curl --proto '=https' --tlsv1.2 -sSf --retry 3 https://sh.rustup.rs | sh -s -- -y --profile minimal); then
              echo "warn: rustup 安装失败（后续 cargo 步骤将 fail-closed）"
            fi
            export PATH="$HOME/.cargo/bin:$PATH"
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
            cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTS=OFF -DENABLE_SANITIZERS=OFF -DAIRY_BUILD_ALL=ON \
              -DOPENSSL_ROOT_DIR=/usr/local -DCMAKE_PREFIX_PATH=/usr/local \
              -DCMAKE_INSTALL_PREFIX="$PWD/$STAGE_DIR"
            cmake --build "$BUILD_DIR" -j"$(nproc)"
            cmake --install "$BUILD_DIR"
            # Rust TUI（agentrt-tui）：B1 fail-closed——构建失败/缺件即腿失败
            # build.rs 需 airy_run_stream.h（v0.1.10 回归：伞仓相对路径失效）
            export AGENTRT_TUI_RUN_STREAM_H="$PWD/commons/include/airy_run_stream.h"
            export PATH="$HOME/.cargo/bin:$PATH"
            export CARGO_TARGET_DIR=/tmp/tui-target
            (cd agent-workload/sdk/tui && cargo build --release) \
              || { echo "::error::[arm-64] TUI 构建失败（bin/agentrt-tui 发布完整性必需）"; exit 1; }
            cp -f /tmp/tui-target/release/agentrt-tui "$STAGE_DIR/bin/" \
              || { echo "::error::[arm-64] TUI 产物缺失"; exit 1; }
            # Python 运行时依赖（完全体包 lib/，B1 fail-closed）
            bash /src/.github/scripts/copy-python-runtime.sh "$STAGE_DIR" \
              || { echo "::error::python 运行时四子树拷贝失败（lib/ 完整性必需）"; exit 1; }
            # 完全体 finalize：容器内收集运行时 .so + fail-closed 校验（host
            # 无 /usr/local 自编译库，收集必 not found；.collected 不入包）
            bash /src/.github/scripts/finalize-linux-libs.sh "$STAGE_DIR" /src/_tools

      # 打包：lf-package 统一模板（staging 汇总 cp 硬失败防坏包）。
      - name: Package and upload (tar.gz)
        uses: ./.github/actions/lf-package
        with:
          version: ${{ env.VERSION }}
          platform-tag: arm-64
          artifact-suffix: linux-arm-64

  # 32 位 Linux（x86-32 / arm-32 双腿，均门禁）：六架构兼容
  # 决策（2026-08-30）补全 32 位构建门禁。统一 glibc 2.31 基线；覆盖老
  # x86 与 32 位 ARM 用户空间——64 位内核 + 32 位用户态场景。
  # 0.1.12 I1 收口（2026-09-06）：两腿均改预构建工具链镜像（GHCR 公开，
  # digest 钉版，apt 依赖 + lib-builddeps 自编译产物固化）+ 原生执行
  # 零 QEMU——x86-32 在 x86_64 runner 经 CONFIG_IA32_EMULATION；
  # arm-32 在 aarch64 runner 经 CONFIG_COMPAT（0.1.11 E1 已切）。镜像
  # 构建本身即宿主 32 位兼容性 fail-fast（无 IA32/COMPAT 则 docker run
  # 直接 exec format error）。容器内架构判定禁用 uname（32 位容器返回
  # 内核架构，U10 陷阱），统一 dpkg --print-architecture fail-fast。
  # TUI 交叉构建移入 64 位钉版容器（U10/P20，rc1 run 45 实证修正）：
  # 宿主交叉两处硬伤——① rustc 不拆分 linker argv，LINKER="gcc -m32"
  # 报 linker not found；② 宿主（24.04）交叉产物绑宿主 glibc 2.39，破
  # 坏 bullseye 2.31 基线（arm-32 被容器内 finalize fail-closed 拦截、
  # x86-32 降级致包缺 TUI）。amd64/arm64 工具链镜像基线 ubuntu 20.04
  # （glibc 2.31）：容器内 gcc-multilib/cross-gcc 的 32 位 glibc 即
  # 2.31，64 位 rustup + 32 位 target 交叉产物天然对齐基线；i386 容器
  # 内 rustup 不可行（U10）。失败降级不阻断（finalize 有 glibc 闸）。
  # 矩阵解耦（0.1.11 E6，2026-09-05）：arm-32 独立成腿，不再与本矩阵
  # 同组。此前 release.needs 依赖整个矩阵，arm-32 单腿 QEMU 50min+ 未完，
  # release/publish（含审批）就始终不出现（v0.1.10 同版本重发 run 实证，
  # 用户问"还在进度中？为什么这么慢"）。拆分后本 job 仅 x86-32 一项
  #（已实证门禁架构），arm-32 独立为下方 build-linux-arm-32 job；原生化
  # 后 2m37s 首验 → rc3/rc4/rc6/正式发布连续全绿 → 0.1.12 G3（2026-09-06）
  # 将其置回门禁（continue-on-error:false + 移入 release.needs，见该 job
  # 头注）。
  build-linux-32:
    runs-on: ubuntu-latest
    continue-on-error: false
    env:
      BUILD_DIR: build
      STAGE_DIR: stage
      # 32 位用户态地址空间受限：自编译 deps（lib-builddeps.sh）与 cmake
      # 构建统一小并行（AIRY_JOBS），避免 -j$(nproc) 大并行 OOM/失败。
      AIRY_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # 宿主机完成定向检出后再 docker run（-v "$PWD":/src 挂载需含
      # agent-workload/ 与 tools/）
      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      # 0.1.12 P20（2026-09-06）：x86-32 TUI 改 amd64 钉版容器内交叉。
      # i386 容器内 rustup 不可行（U10）；宿主交叉两处硬伤（rc1 run 45
      # 实证）：rustc 不拆分 linker argv、产物绑宿主 glibc 2.39。amd64
      # 工具链镜像基线 ubuntu 20.04（glibc 2.31）：容器内 gcc-multilib
      # 的 32 位 glibc 即 2.31，x86_64 rustup + i686 target 交叉产物
      # 天然对齐基线。链接：rustc 不拆分 linker argv，LINKER 用裸 gcc
      # + RUSTFLAGS -C link-arg=-m32（gcc 驱动位置无关接受 -m32）。
      # 失败降级不阻断（finalize 有 glibc 闸）。
      - name: Build TUI (i686 cross in amd64 container)
        uses: ./.github/actions/lf-build-container
        with:
          image: ghcr.io/openairymax/agentrt-qemu-toolchain:amd64-20260906-1@sha256:99d3ac35030b3a19ef36277b443e011005224ee53b6187e8a60ca40b429def82
          platform: linux/amd64
          leg: tui-i686-cross
          script: |
            set -euo pipefail
            apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc-multilib
            curl --proto =https --tlsv1.2 -sSf --retry 3 https://sh.rustup.rs | sh -s -- -y --profile minimal
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup target add i686-unknown-linux-gnu
            # 链接需 -m32（32 位 crt/start files，gcc-multilib 提供）
            export CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=gcc
            export RUSTFLAGS="-C link-arg=-m32"
            # build.rs 需 airy_run_stream.h（v0.1.10 回归：伞仓相对路径失效）
            export AGENTRT_TUI_RUN_STREAM_H=/src/commons/include/airy_run_stream.h
            export CARGO_TARGET_DIR=/tmp/tui-target
            # x86-32 门禁产品腿，TUI 属 REQUIRED_SUBTREE：B1 fail-closed
            (cd /src/agent-workload/sdk/tui && cargo build --release --target i686-unknown-linux-gnu) \
              || { echo "::error::[x86-32] TUI 交叉构建失败（bin/agentrt-tui 发布完整性必需）"; exit 1; }
            mkdir -p /src/stage/bin
            cp -f /tmp/tui-target/i686-unknown-linux-gnu/release/agentrt-tui /src/stage/bin/ \
              || { echo "::error::[x86-32] TUI 产物缺失"; exit 1; }

      - name: Build in x86-32 container
        uses: ./.github/actions/lf-build-container
        with:
          # I1 收口（2026-09-06）：预构建 i386 工具链镜像（GHCR 公开，
          # digest 钉版）。apt 依赖 + lib-builddeps 自编译产物已固化进
          # 镜像（debian:bullseye-20240812-slim + snapshot.debian.org
          # 20240812T000000Z 源，glibc 2.31 基线不变；EOL 配方细节见
          # .github/docker/qemu-toolchain/debian-i386.Dockerfile，与本
          # 腿同源）。linux/386 容器在 x86_64 hosted runner 经内核
          # CONFIG_IA32_EMULATION 原生执行——零 QEMU，省去每轮
          # apt + 源码重编 deps（对比 0.1.11 qemu 腿 5-8min 准备）。
          image: ghcr.io/openairymax/agentrt-qemu-toolchain:i386-20260906-1@sha256:1266ca270863b1a79a341acd65ca867a745f068ede80fa6f6c099ba8cbd3b76b
          platform: linux/386
          leg: x86-32
          envs: -e BUILD_DIR=/tmp/airy-build -e STAGE_DIR=stage -e AIRY_JOBS
          script: |
            # fail-fast：容器内架构必须为 i386。uname 在 32 位容器返回
            # 内核架构（x86_64），禁用（U10 陷阱）；dpkg 视角才可信。
            [ "$(dpkg --print-architecture)" = "i386" ] || {
              echo "::error::[x86-32] container arch != i386: $(dpkg --print-architecture)"; exit 1; }
            # 0.1.6f SSoT：cmake/cJSON/OpenSSL/libcurl/libwebsockets 已
            # 由镜像构建期 lib-builddeps.sh 固化（/usr/local）。
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
            cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTS=OFF -DENABLE_SANITIZERS=OFF -DAIRY_BUILD_ALL=ON \
              -DOPENSSL_ROOT_DIR=/usr/local -DCMAKE_PREFIX_PATH=/usr/local \
              -DCMAKE_INSTALL_PREFIX="$PWD/$STAGE_DIR"
            cmake --build "$BUILD_DIR" -j"${AIRY_JOBS:-$(nproc)}"
            cmake --install "$BUILD_DIR"
            # Python 运行时依赖（完全体包 lib/，B1 fail-closed）
            bash /src/.github/scripts/copy-python-runtime.sh "$STAGE_DIR" \
              || { echo "::error::python 运行时四子树拷贝失败（lib/ 完整性必需）"; exit 1; }
            # 完全体 finalize：容器内收集运行时 .so + fail-closed 校验（host
            # 无 /usr/local 自编译库，收集必 not found；.collected 不入包）
            bash /src/.github/scripts/finalize-linux-libs.sh "$STAGE_DIR" /src/_tools

      # 打包：lf-package 统一模板（staging 汇总 cp 硬失败防坏包）。
      - name: Package and upload (tar.gz)
        uses: ./.github/actions/lf-package
        with:
          version: ${{ env.VERSION }}
          platform-tag: x86-32
          artifact-suffix: linux-x86-32

  # arm-32 (linux-arm-32) 门禁腿：0.1.11 E6 矩阵解耦产物，与 x86-32 解耦
  # 原因见 build-linux-32 头注（QEMU 单腿 50min+ 曾整体阻塞 release/publish
  # 审批）。G3 收口（2026-09-06，0.1.12 正式发布后）：连续绿实证（原生首验
  # 2m37s → rc3 #49 → rc4 #50 → rc6 → 正式 v0.1.12 tag run，共 5+ run 全绿，
  # 包内 ELF 32-bit ARM + lib/ .so=20 + 三代 markers 产物核验通过）→ 置回
  # 门禁：continue-on-error: false + 移入 release.needs（下方 release 头注
  # 同步更新）。
  # E1 收口（2026-09-05）：切原生 arm64 runner（ubuntu-24.04-arm）+
  # 预构建 armhf 工具链镜像（digest 钉版，apt+lib-builddeps 已固化）。
  # linux/arm/v7 在 aarch64 宿主上经内核 CONFIG_COMPAT 原生执行（零
  # QEMU，Cobalt 100 实证）；glibc 2.31 基线不变。容器内架构判定禁用
  # uname（compat 下返回 aarch64，OpenSSL run 11 陷阱，tools 18f6bb3
  # 已修），镜像内 deps 目标已按编译器判定固化。AIRY_JOBS=2 限并行
  # 防 32 位链接期地址空间不足（QEMU 时代教训沿用，首切原生保守值）。
  build-linux-arm-32:
    runs-on: ubuntu-24.04-arm
    continue-on-error: false
    env:
      BUILD_DIR: build
      STAGE_DIR: stage
      AIRY_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # 宿主机完成定向检出后再 docker run（-v "$PWD":/src 挂载需含
      # agent-workload/ 与 tools/）
      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      # 原生 arm64 runner + AArch32 compat：无需 Set up QEMU。
      # docker run --platform linux/arm/v7 原生执行（无 binfmt 模拟）。

      # 0.1.12 P20（2026-09-06）：arm-32 TUI 改 arm64 钉版容器内交叉。
      # arm/v7 容器内 rustup 不可行（U10）；宿主（24.04）交叉产物绑
      # glibc 2.39，被 bullseye 2.31 容器内 finalize glibc 闸
      # fail-closed 拦截（rc1 run 45 实证）。arm64 工具链镜像基线
      # ubuntu 20.04（glibc 2.31）：容器内 gcc-arm-linux-gnueabihf 的
      # cross glibc 即 2.31，aarch64 rustup + armv7 target 交叉产物
      # 天然对齐基线（cross linker 无空格，LINKER 直接可用）。
      # 失败降级不阻断（finalize 有 glibc 闸）。
      - name: Build TUI (armv7 cross in arm64 container)
        uses: ./.github/actions/lf-build-container
        with:
          image: ghcr.io/openairymax/agentrt-qemu-toolchain:arm64-20260906-1@sha256:598a269f97744d81d80c67ffd7516f7f79ad33b8bc904346a56a5c31d3dbc146
          platform: linux/arm64
          leg: tui-arm32-cross
          script: |
            set -euo pipefail
            # #49 实证（2026-09-06）：仅装 gcc-arm-linux-gnueabihf 不够——
            # arm64 容器内其 cross sysroot（libc6-dev-armhf-cross 提供的
            # /usr/arm-linux-gnueabihf/include + bits/libc-header-start.h）
            # 缺席时，gcc 的 stdint.h fallback 宿主 /usr/include/stdint.h
            # → ring 0.17.14 C 编译 fatal（bits/libc-header-start.h 缺失）
            # → arm-32 包 TUI 静默缺失（U11）。显式补 cross C 库头。
            apt-get update -qq && apt-get install -y -qq --no-install-recommends \
              gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
            curl --proto =https --tlsv1.2 -sSf --retry 3 https://sh.rustup.rs | sh -s -- -y --profile minimal
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup target add armv7-unknown-linux-gnueabihf
            export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc
            # build.rs 需 airy_run_stream.h（v0.1.10 回归：伞仓相对路径失效）
            export AGENTRT_TUI_RUN_STREAM_H=/src/commons/include/airy_run_stream.h
            export CARGO_TARGET_DIR=/tmp/tui-target-arm32
            # arm-32 门禁产品腿，TUI 属 REQUIRED_SUBTREE：B1 fail-closed
            #（U11 教训：arm-32 TUI 曾静默缺失，仅发布预检兜底）
            (cd /src/agent-workload/sdk/tui && cargo build --release --target armv7-unknown-linux-gnueabihf) \
              || { echo "::error::[arm-32] TUI 交叉构建失败（bin/agentrt-tui 发布完整性必需）"; exit 1; }
            mkdir -p /src/stage/bin
            cp -f /tmp/tui-target-arm32/armv7-unknown-linux-gnueabihf/release/agentrt-tui /src/stage/bin/ \
              || { echo "::error::[arm-32] TUI 产物缺失"; exit 1; }

      - name: Build in arm-32 container
        uses: ./.github/actions/lf-build-container
        with:
          # E1 收口（2026-09-05）：预构建 armhf 工具链镜像（GHCR 公开，
          # digest 钉版）。apt 依赖 + lib-builddeps 自编译产物已固化进
          # 镜像（Dockerfile 与 release 腿同源，glibc 2.31 基线不变）。
          image: ghcr.io/openairymax/agentrt-qemu-toolchain:arm32-20260906-1@sha256:2a661a6c33f69e00e2210e12ce185f82355218427fecfcf2ba2e75e8163d6477
          platform: linux/arm/v7
          leg: arm-32
          envs: -e BUILD_DIR=/tmp/airy-build -e STAGE_DIR=stage -e AIRY_JOBS
          script: |
            # fail-fast：容器内架构必须为 armhf。uname 在 AArch32 compat
            # 下返回内核架构（aarch64），禁用（U10 陷阱）；dpkg 才可信。
            [ "$(dpkg --print-architecture)" = "armhf" ] || {
              echo "::error::[arm-32] container arch != armhf: $(dpkg --print-architecture)"; exit 1; }
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
            cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTS=OFF -DENABLE_SANITIZERS=OFF -DAIRY_BUILD_ALL=ON \
              -DOPENSSL_ROOT_DIR=/usr/local -DCMAKE_PREFIX_PATH=/usr/local \
              -DCMAKE_INSTALL_PREFIX="$PWD/$STAGE_DIR"
            cmake --build "$BUILD_DIR" -j"${AIRY_JOBS:-$(nproc)}"
            cmake --install "$BUILD_DIR"
            # Python 运行时依赖（完全体包 lib/，B1 fail-closed）
            bash /src/.github/scripts/copy-python-runtime.sh "$STAGE_DIR" \
              || { echo "::error::python 运行时四子树拷贝失败（lib/ 完整性必需）"; exit 1; }
            # 完全体 finalize：容器内收集运行时 .so + fail-closed 校验（host
            # 无 /usr/local 自编译库，收集必 not found；.collected 不入包）
            bash /src/.github/scripts/finalize-linux-libs.sh "$STAGE_DIR" /src/_tools

      # 打包：lf-package 统一模板（staging 汇总 cp 硬失败防坏包）。
      - name: Package and upload (tar.gz)
        uses: ./.github/actions/lf-package
        with:
          version: ${{ env.VERSION }}
          platform-tag: arm-32
          artifact-suffix: linux-arm-32

  # 汇聚门禁平台制品 → 聚合为 release-dist 附件：既作为下方 publish job 的
  # 发布源，也作为审计/紧急 fallback 归档留存（release 附件 90 天）。
  # cosign+GPG+manifest+atomgit 上传统一由 _tools/scripts/ci/release/
  # publish-release.sh 执行。0.1.11（D0/D1/D2）：发布全链迁入下方 publish
  # job，签名私钥存 release Environment secrets，需维护者人工 Approve 后才
  # 执行签名上传；本机发布路径降级为紧急 fallback。历史根因（v0.1.9 R16
  # 实证：runner 美东→atomgit/OBS 上传 ~20MB 需 ~15min 撞 900s 超时被掐断）
  # 已由脚本 --max-time 3600 + 3 并发 + 上传完整性校验根治。
  release:
    # 门禁（0.1.13 清零）：Linux x86-64 / x86-32 / arm-64 / arm-32 + macOS
    # arm-64 / x86-64 + **Windows x86-64** 七平台（G1 升 gate 2026-09-07：
    # windows 产品完整 + MSVC ctest 全绿，见 build-windows-x86-64 头注；
    # arm-32 于 G3 收口 2026-09-06 移入 needs）。riscv 为 dispatch-only
    # canary（B10：0.1.13 不发 RISC-V 制品，QEMU 6h 上限预留 0.3.x）。
    needs: [build-linux-x86-64, build-macos-arm-64, build-macos-x86-64, build-linux-arm-64, build-linux-32, build-linux-arm-32, build-windows-x86-64]
    runs-on: ubuntu-latest
    # tag 推送或手动 dispatch（手动时版本来自 inputs.version）皆可触发
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # 关键修复：release job 此前完全不初始化子模块 → tools/ 为空 →
      # publish-release.sh 不存在，发布必然失败。agent-workload 供安装器
      # 源（agentrt/scripts/install.{sh,ps1}）与更新器源（sdk/tui/scripts/
      # airymaxrt），tools 供发布脚本本体。
      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # G1（2026-09-07）：windows zip 随 release 聚合入 dist，publish
      # REQUIRED_BIN/SUBTREE 预检为 G1 出口实证（zip 任一 daemon/CLI/TUI/
      # python 缺失即中止发布）。zip 不参与下方 gen1~gen3 标记补全
      #（tar.gz 专用；windows 首版 0.1.13 发布，无旧安装器兼容面）。
      - name: Assert windows zip present in release dist
        run: |
          ls -la dist/agentrt-*-windows-x86-64.zip* 2>/dev/null \
            || { echo "::error::windows zip 未聚合入 dist（G1 出口缺失）"; exit 1; }
          echo "release dist 最终制品: $(ls dist/agentrt-*.tar.gz 2>/dev/null | wc -l) 个 tar.gz + $(ls dist/*.zip 2>/dev/null | wc -l) 个 zip"

      # 0.1.10a 修复（生产实证，2026-09-05）：包内只含 gen3 标记（如
      # platform-x86-64）导致 ≤v0.1.9 更新器拒绝升级——旧更新器以精确文件名
      # 匹配（platform-x64 等，且其 "不匹配" 正则会把 platform-x86-64 子串
      # 误判为异架构）。此处单点 SSoT：为每个平台包补全 gen1~gen3 三代全量
      # platform-* 标记文件并重算 sha256，任何一代更新器/安装器均可匹配。
      # 口径与 sdk/tui/scripts/airymaxrt 及 agentrt/scripts/install.sh 的
      # plat_markers 同源（本处按架构词 x86-64/x86-32/arm-64/arm-32/...）。
      - name: Augment package arch markers (gen1~gen3)
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"
          markers_of() {
            case "$1" in
              x86-64)   echo "platform-x86-64 platform-x64 platform-x86_64 platform-amd64" ;;
              x86-32)   echo "platform-x86-32 platform-x86 platform-i686 platform-i386" ;;
              arm-64)   echo "platform-arm-64 platform-arm64 platform-aarch64" ;;
              arm-32)   echo "platform-arm-32 platform-arm32 platform-armv7l" ;;
              riscv-64) echo "platform-riscv-64 platform-riscv64" ;;
              riscv-32) echo "platform-riscv-32 platform-riscv32" ;;
              *) echo "" ;;
            esac
          }
          cd dist
          for t in agentrt-${VERSION}-*.tar.gz; do
            [ -e "$t" ] || continue
            plat="${t#agentrt-${VERSION}-}"; plat="${plat%.tar.gz}"
            arch="${plat#*-}"   # linux-x86-64 → x86-64（marker 只编码架构）
            ms="$(markers_of "$arch")"
            if [ -z "$ms" ]; then
              echo "::warning::跳过未知平台 ${plat} 的标记补全"
              continue
            fi
            tmpd="$(mktemp -d)"
            tar -xzf "$t" -C "$tmpd"
            # 各腿以 tar -C pkg . 打包 → 标记位于归档根
            for m in $ms; do [ -e "$tmpd/$m" ] || touch "$tmpd/$m"; done
            tar -czf "$t" -C "$tmpd" .
            rm -rf "$tmpd"
            sha256sum "$t" > "$t.sha256"
            echo "augment markers ${plat}: ${ms}"
          done
          echo "标记补全完成: $(ls agentrt-${VERSION}-*.tar.gz | wc -l) 个包"

      - name: Generate release notes
        run: |
          VERSION="${{ env.VERSION }}"
          PREV="$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || echo '')"
          if [ -n "$PREV" ]; then
            git log --oneline --no-merges "${PREV}..${VERSION}" | head -60
          else
            git log --oneline --no-merges -20
          fi > dist/notes.txt
          echo "变更摘要已生成: $(wc -l < dist/notes.txt) 行"

      # 发布交接（发布已移出 runner）：校验 dist 后聚合上传为单一附件。
      # 本地发布命令（MCP/维护者）：
      #   download agentrt-<ver>-release-dist → sha256sum -c → 
      #   _tools/scripts/ci/release/publish-release.sh "<ver>" <dist_dir>
      - name: Aggregate dist for atomgit publish (hand-off)
        run: |
          ls -la dist/
          test -n "$(ls dist/*.tar.gz 2>/dev/null)" || {
            echo "::error::dist 无 tar.gz 制品，无法发布交接"; exit 1
          }
          test -n "$(ls dist/*.tar.gz.sha256 2>/dev/null)" || {
            echo "::error::dist 缺 sha256 校验件"; exit 1
          }
          # 安装器 SSoT 随附，便于本地发布直接使用（对齐
          # publish-release.sh 的 AIRY_INSTALLER_SRC 默认值）。B1 fail-closed：
          # 安装器为发布交接必需件，缺失即中止（不再静默）
          cp -f scripts/install.sh dist/ || { echo "::error::缺 scripts/install.sh（安装器 SSoT）"; exit 1; }
          cp -f scripts/install.ps1 dist/ || { echo "::error::缺 scripts/install.ps1"; exit 1; }
          echo "发布交接包就绪: $(ls dist | wc -l) 个文件"

      - name: Upload release-dist (for audit / emergency fallback)
        uses: actions/upload-artifact@v4
        with:
          name: agentrt-${{ env.VERSION }}-release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  # H2（0.1.13）：容器洁净 e2e 门禁——在洁净 ubuntu:20.04 容器（与
  # build-linux-x86-64 腿工具链镜像同 glibc 2.31 基线）内，对聚合后的
  # release-dist 制品执行 install.sh --from-file 离线安装 → 启动 daemon 群
  # → airy_cli /daemons 冒烟，一次 rc 全链出证（install→daemon→gateway→
  # CLI）。容器内无任何开发工具链（脚本 fail-closed 断言），等价用户干净
  # 机。门禁：publish needs 本 job，e2e 不过则不发布（残余静默面收口：
  # spec 0.1.13 第 11 条"待 H2 e2e 载体落地后在腿级改 fail-closed"）。
  e2e-clean-room:
    needs: [release]
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      # e2e 脚本本体在 tools 仓（_tools/scripts/ci/release/e2e-clean-room.sh）。
      - name: Init submodules (tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh tools

      - name: Download release-dist
        uses: actions/download-artifact@v4
        with:
          name: agentrt-${{ env.VERSION }}-release-dist
          path: dist

      - name: Preflight
        run: |
          test -f dist/install.sh || {
            echo "::error::release-dist 缺 install.sh（安装器 SSoT）"; exit 1; }
          test -f "dist/agentrt-${{ env.VERSION }}-linux-x86-64.tar.gz" || {
            echo "::error::release-dist 缺 linux-x86-64 tarball，无法洁净 e2e"; exit 1; }
          test -f "dist/agentrt-${{ env.VERSION }}-linux-x86-64.tar.gz.sha256" || {
            echo "::error::release-dist 缺 linux-x86-64 sha256 校验件"; exit 1; }

      # U9（2026-09-07，0.1.13 清零）：旧版升级路径 e2e——拉取当前 stable
      #（prev）linux-x86-64 制品 + sha256（取自 stable manifest 的 url/sha256，
      # 非文件名猜测），传 e2e 脚本第三参执行阶段 U（旧版离线安装 → update
      # --file 新版 → config 兼容断言 → rollback 回退断言）。prev 与本次发布
      # 同版本（稳定版同版重发）时跳过——无升级路径语义。
      - name: Fetch previous stable tarball (U9 upgrade path)
        run: |
          set -euo pipefail
          mf="$(mktemp)"
          curl -fsSL "https://api.atomgit.com/api/v5/repos/openairymax/agentrt/contents/latest/manifest.stable.json?ref=main" \
            | python3 -c 'import json,sys,base64;sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)["content"]))' > "$mf"
          python3 - "$mf" /tmp/u9.env <<'PYEOF'
          import json, sys
          m = json.load(open(sys.argv[1]))
          pv = m['latest']
          art = m['releases'][pv]['artifacts'].get('linux-x86-64')
          assert art, 'prev stable manifest 无 linux-x86-64 artifact'
          with open(sys.argv[2], 'w') as f:
              f.write("PV=%s\nPVURL=%s\nPVSHA=%s\n" % (pv, art['url'], art['sha256']))
          PYEOF
          . /tmp/u9.env
          cur_norm="${VERSION#v}"; pv_norm="${PV#v}"
          if [ "$cur_norm" = "$pv_norm" ]; then
            echo "U9 跳过：prev(${PV}) == 本次发布(${VERSION})"
            echo "PREV_TARBALL=" >> "$GITHUB_ENV"
          else
            fn="$(basename "$PVURL")"
            curl -fsSL -o "dist/$fn" "$PVURL"
            printf '%s  %s\n' "$PVSHA" "$fn" > "dist/$fn.sha256"
            (cd dist && sha256sum -c "$fn.sha256")
            echo "PREV_TARBALL=dist/$fn" >> "$GITHUB_ENV"
            echo "U9 prev stable: $PV -> dist/$fn"
          fi

      # 镜像不用 digest 钉版：ubuntu:20.04 已 EOS（standard support 2025-05
      # 结束），官方 tag 冻结不再重推，浮动风险趋零；glibc 2.31 基线由 tag
      # 绑定。未来切基线（22.04/24.04）时须与构建腿工具链镜像同步切换并
      # 恢复 digest 钉版。
      - name: Clean-room e2e (install → daemons → CLI smoke + U9 upgrade path)
        run: |
          docker pull ubuntu:20.04
          PREV_ARG=""
          if [ -n "${PREV_TARBALL:-}" ]; then PREV_ARG="/w/$PREV_TARBALL"; fi
          docker run --rm -v "$PWD:/w:ro" ubuntu:20.04 \
            bash /w/_tools/scripts/ci/release/e2e-clean-room.sh \
              /w/dist/install.sh \
              "/w/dist/agentrt-${{ env.VERSION }}-linux-x86-64.tar.gz" \
              $PREV_ARG

  # 发布全链（0.1.11 D0/D1/D2）：cosign 签名制品 + GPG 签名 manifest +
  # manifest 生成（含 gen1~gen3 平台别名）+ 上传 atomgit release +
  # push latest/ 固定入口，全部在本 job 内完成，零本机操作。
  # 密钥与令牌来自受保护 Environment 'release' secrets（仅 refs/tags/v*
  # 可引用；需维护者 Approve 后本 job 才执行，审批即发布安全阀）。
  # 紧急 fallback：下载 release-dist 附件后本地执行
  #   _tools/scripts/ci/release/publish-release.sh <ver> <dist_dir>
  # （本机保留 A1 所述私钥副本）。
  publish:
    needs: [release, e2e-clean-room]
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
      ATOMGIT_REPO: openairymax/agentrt
      # P23 根修配套：manifest commit 双端同步所需（publish-release.sh 阶段 5
      # 向 GitHub main 补推，fail-soft；无 PAT 时跳过并告警）。
      GITHUB_REPO: ${{ github.repository }}
      GITHUB_PAT: ${{ secrets.GH_TOKEN }}
      # 同 tag 重发/修复（C4）：OBS 预签名 PUT 按文件名覆盖，设置
      # AIRY_FORCE_UPLOAD=1 使发布永远覆盖远端同名附件，杜绝"跳过上传但
      # manifest 已按新 sha 重生成"的不一致（v0.1.10 同版本修复重发实证）。
      AIRY_FORCE_UPLOAD: '1'
      # runner 布局与本地伞仓不同（agentrt 即工作树根，scripts/ 在根下），
      # 显式指定安装器 SSoT；AIRY_LAUNCHER_SRC 默认已指向
      # agent-workload/sdk/tui/scripts/airymaxrt（init-submodules 补齐）。
      AIRY_INSTALLER_SRC: ${{ github.workspace }}/scripts/install.sh
      AIRY_INSTALLER_PS1_SRC: ${{ github.workspace }}/scripts/install.ps1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # _tools（发布脚本）+ agent-workload/sdk（更新器 airymaxrt 源）由
      # init-submodules.sh 补齐（tools 克隆到 _tools/，与本地伞仓 tools/ 区别）。
      - name: Init submodules (tools, sdk)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh tools

      - name: Install gpg + cosign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gnupg
          # cosign 钉版 v2.6.5（与本机发布台一致，SSoT）：latest（≥2.7）已
          # 强制 --new-bundle-format，废弃 --output-signature 导致
          # "must specify --bundle" 发布失败（v0.1.10 同版本重发实证）。
          curl -fsSLo /tmp/cosign \
            https://github.com/sigstore/cosign/releases/download/v2.6.5/cosign-linux-amd64
          chmod +x /tmp/cosign
          sudo mv /tmp/cosign /usr/local/bin/cosign
          cosign version | grep -i gitversion

      - name: Download release-dist
        uses: actions/download-artifact@v4
        with:
          name: agentrt-${{ env.VERSION }}-release-dist
          path: dist

      - name: Publish to atomgit (sign + manifest + upload + latest/)
        run: |
          test -n "$(ls dist/agentrt-${{ env.VERSION }}-*.tar.gz 2>/dev/null)" || {
            echo "::error::release-dist 无 tar.gz 制品，中止发布"; exit 1
          }
          # 发布前对聚合制品做一遍 sha256 复核（发布预检仍在脚本内再次执行）
          for f in dist/agentrt-${{ env.VERSION }}-*.tar.gz.sha256; do
            (cd dist && sha256sum -c "$(basename "$f")") || { echo "::error::sha256 复核失败: $f"; exit 1; }
          done
          bash _tools/scripts/ci/release/publish-release.sh "${{ env.VERSION }}" dist

