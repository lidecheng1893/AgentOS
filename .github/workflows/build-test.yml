name: Build & Test

on:
  push:
    branches: [main]
    # E5 触发面瘦身（0.1.11）：纯文档/说明变更跳过重型门禁，避免无效
    # runner 队列占用。安全边界：只忽略 md/docs，workflow 与一切源码变更
    # 仍全量验证；PR 保持全量（评审面不因触发优化而缩水）。
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== Linux 全量构建 + 测试 + 覆盖率门禁 ====================
  linux-build-test-coverage:
    runs-on: ubuntu-latest
    # 超时护栏（2026-09-04）：构建+ctest+覆盖率合计上限，防挂死无结论
    timeout-minutes: 150
    env:
      # BAN-33：agentrt 即源码根，构建目录必须在源码树外（工作区上级目录）
      BUILD_DIR: ../build
      # 首次真实行覆盖基线（2026-09-04 实测 28.61%，37674/131693）。
      # 阈值 25 起步 = 基线以下留 fail-closed 余量（30 一度高于基线致门禁
      # 误红，dc06d4fde 实证）；随测试补充逐版上调（见 Linux job 注释）。
      COVERAGE_THRESHOLD: 25
    steps:
      # M3 方案 B（0.1.12）：定向子模块检出收敛为 lf-init-deps 复合 action
      # （同源模板，防 build-test/release 双实现漂移——P3）。checkout 必
      # 须是独立远程 action 首步（build-test #103 实证：本地 composite 在
      # job 初始化阶段解析、早于任何 step，无法在内部自举 checkout）。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
      - name: Init submodules (targeted)
        uses: ./.github/actions/lf-init-deps
        with:
          groups: agent-workload
          gh_token: ${{ secrets.GH_TOKEN }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build gcovr \
            libsqlite3-dev libcjson-dev libyaml-dev libcurl4-openssl-dev \
            libssl-dev zlib1g-dev libzstd-dev \
            libmicrohttpd-dev libwebsockets-dev libevent-dev \
            python3 python3-pip

      - name: Configure (ENABLE_COVERAGE=ON, BUILD_TESTS=ON)
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DENABLE_COVERAGE=ON \
            -DAIRY_BUILD_ALL=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: |
          cmake --build ${{ env.BUILD_DIR }} --parallel "$(nproc)"

      - name: Run tests (ctest, auto-retry once)
        run: |
          # --timeout 240：单测超时护栏。瞬态 flaky（tool_d_test_executor
          # 2026-09-06 实证：linux runner 负载下并发时序单测首轮偶发红、
          # 同环境 rerun-failed 即全过）经一次自动重试吸收；真实回归
          # rerun 仍失败 → fail-closed。与 macOS 腿（corekern_deep
          # 2026-09-05 实证）同口径。
          set +e
          ctest --test-dir "${{ env.BUILD_DIR }}" --output-on-failure -j"$(nproc)" \
            --timeout 240 > /tmp/ctest.log 2>&1
          rc=$?
          if [ $rc -eq 0 ]; then
            exit 0
          fi
          echo "::error::ctest FAILED rc=$rc (attempt 1)，自动 rerun-failed…"
          awk '/The following tests FAILED:/,/Errors while running CTest/' /tmp/ctest.log | sed 's/^/::error::  /' | head -40
          grep -E '^\s*[0-9]+/[0-9]+ Testing|FAILED|Failed' /tmp/ctest.log | sed 's/^/::error::  /' | head -40
          ctest --test-dir "${{ env.BUILD_DIR }}" --output-on-failure --rerun-failed \
            --timeout 240 > /tmp/ctest-rerun.log 2>&1
          rc2=$?
          if [ $rc2 -eq 0 ]; then
            echo "::warning::ctest attempt1 失败但 rerun-failed 全过（flaky），门禁放行"
            exit 0
          fi
          echo "::error::ctest rerun FAILED rc=$rc2"
          tail -n 40 /tmp/ctest-rerun.log | sed 's/^/::error::  /'
          exit $rc2

      # 覆盖率门禁：低于阈值（COVERAGE_THRESHOLD）即失败，
      # 防止发行版功能回归（50-engineering-standards / TEST-03）。
      # 用 gcovr（非 lcov 2.0）：lcov 2.0 + gcc 13.3 中间 gcov 格式下
      # geninfo 处理到部分 .gcda 即崩溃（rc=1、无错误输出，多轮实证），
      # 未命中 exclude 又判硬错误、空 tracefile 却 rc=0；gcovr 对单个
      # gcov 文件错误鲁棒。Cobertura XML 的 lines-covered/lines-valid
      # 作为行覆盖率唯一口径（exclude tests/build/usr 源码）。
      # --gcov-ignore-errors=no_working_dir_found：树外构建（BUILD_DIR=../build）
      # 中个别测试 .gcda 源路径带前缀解析不到（coreloopthree tests 实证，
      # rc=64）；tests 覆盖率本就排除，忽略该错误不参与统计。
      # --root 取工作区父目录：树外构建的 .gcda 记录源路径带 agentrt/ 前缀
      #（gcc 工作目录为 checkout 父级），root=. 时 gcovr 对全部源解析失败
      #（lines-valid=0，2026-09-04 实证），root=父目录后 agentrt/<src> 命中。
      # --gcov-ignore-parse-errors=negative_hits：gcc gcov 已知 bug 产生
      # "branch taken -1"（gcc.gnu.org/68080），按 gcovr 官方建议 warn 忽略。
      # --merge-mode-functions=merge-use-line-0：LTO/内联克隆致同名函数多行出现
      #（ws_gateway_create 246/323 实证），strict 抛 AssertionError；gcovr 7.0
      # 合法取值 strict/merge-use-line-{0,min,max}/separate（无 merge），
      # merge-use-line-0 将多行同名函数并入 file 级条目。
      - name: Collect coverage (gcovr)
        run: |
          set +e
          gcovr --root "$(realpath "${{ github.workspace }}/..")" \
            --object-directory ${{ env.BUILD_DIR }} \
            --gcov-ignore-errors=no_working_dir_found \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --merge-mode-functions=merge-use-line-0 \
            --exclude '.*/(tests|build)/.*' \
            --exclude '.*/agentrt/commons/third_party/.*' \
            --exclude '/usr/.*' \
            --xml-pretty -o ${{ env.BUILD_DIR }}/coverage.xml > /tmp/gcovr.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::gcovr FAILED rc=$rc"
            tail -n 40 /tmp/gcovr.log | sed 's/^/::error::  /'
            exit $rc
          fi
          tail -n 8 /tmp/gcovr.log
          echo "gcovr summary: $(grep -oE 'lines-(valid|covered)="[0-9]+"' ${{ env.BUILD_DIR }}/coverage.xml | tr '\n' ' ')"

      - name: Enforce coverage threshold
        env:
          XML: ${{ env.BUILD_DIR }}/coverage.xml
          THR: ${{ env.COVERAGE_THRESHOLD }}
        run: |
          VALID=$(grep -oE 'lines-valid="[0-9]+"' "$XML" | grep -oE '[0-9]+')
          COVERED=$(grep -oE 'lines-covered="[0-9]+"' "$XML" | grep -oE '[0-9]+')
          if [ -z "$VALID" ] || [ "$VALID" = "0" ]; then
            echo "::error::coverage.xml has no lines-valid (empty data) - gate cannot run"
            exit 1
          fi
          if awk -v c="$COVERED" -v v="$VALID" -v t="$THR" 'BEGIN { pct = 100.0 * c / v; printf "Line coverage: %.2f%% (threshold: %.0f%%)\n", pct, t; exit !(pct >= t) }'; then
            echo "[OK] Coverage meets threshold"
          else
            echo "[FAIL] Coverage below threshold"
            exit 1
          fi

  # ==================== macOS 跨平台构建门禁 ====================
  macos-build:
    # E3 hosted runner 争抢治理（0.1.11）：macos-latest 腿跨 workflow（本 job
    # 与 release.yml macos 腿）共享 ci-macos-runner-bus，串行不抢占，避免
    # 多 workflow 齐发把 mac 配额打满排队；cancel-in-progress:false=公平等待
    #（不杀测试中的 job）。
    concurrency:
      group: ci-macos-runner-bus
      cancel-in-progress: false
    runs-on: macos-latest
    # 超时护栏（2026-09-04 系统性加固）：此前无 timeout，任一测试挂死会让
    # job 挂到 GitHub 默认 6h 上限，整轮门禁长期 in_progress、无结论。
    timeout-minutes: 90
    env:
      # BAN-33：构建目录位于源码树外（工作区上级目录）
      BUILD_DIR: ../build
    steps:
      # 同 linux job：checkout 独立远程首步 + lf-init-deps 定向检出
      # （#103 实证：本地 composite 无法在内部自举 checkout）。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
      - name: Init submodules (targeted)
        uses: ./.github/actions/lf-init-deps
        with:
          groups: agent-workload
          gh_token: ${{ secrets.GH_TOKEN }}

      - name: Install build dependencies (Homebrew)
        run: |
          brew install cmake ninja pkgconf sqlite cjson libyaml curl openssl zlib zstd \
            libmicrohttpd libwebsockets libevent nghttp2

      # openssl / zlib / sqlite 为 keg-only，需显式导出 pkg-config 路径供 find_package 使用
      - name: Configure (clang, BUILD_TESTS=ON)
        run: |
          # curl 与 openssl/zlib/sqlite 同为 brew keg-only，须显式导出 pkg-config 路径，
          # 否则 find_package(CURL) 与 pkg_check_modules(libcurl) 均落空，
          # AIRY_HAS_CURL=FALSE 导致 macOS 构建静默剔除 HTTP/联网功能
          export PKG_CONFIG_PATH="$(brew --prefix openssl)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig"
          # 与 release.yml 对齐：keg-only openssl 头文件、Apple Silicon 下裸库名
          # （-lmicrohttpd 等）需显式 -I/-L，否则 build-test 与 release 环境漂移，
          # 门禁绿但发布红（release.yml 实证）
          # arm64 Homebrew 头文件在 $(brew --prefix)/include，clang 不自动搜索：
          # 缺该 -I 时 yaml.h/microhttpd.h 等非 keg-only 头同样报 file not found。
          export CFLAGS="-I$(brew --prefix)/include -I$(brew --prefix openssl)/include"
          export LDFLAGS="-L$(brew --prefix)/lib -L$(brew --prefix openssl)/lib"
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DAIRY_BUILD_ALL=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: |
          # clang 编译失败详情经 ::error:: 上报为 annotation（匿名 API 可读）
          set +e
          cmake --build "${{ env.BUILD_DIR }}" --parallel "$(sysctl -n hw.ncpu)" > /tmp/macos-build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::macOS Build FAILED rc=$rc"
            grep -E ': error:|fatal error:|Error [0-9]|undefined symbol|ld: ' /tmp/macos-build.log | sort -u | head -40 | sed 's/^/::error::  /'
            tail -n 30 /tmp/macos-build.log | sed 's/^/::error::  /'
            exit $rc
          fi

      # 失败即把完整日志落 ci-debug issue（公共 issue 匿名 API 可读，供排障拉取；
      # annotation 每 job 仅保留 ≤10 条，无法承载完整失败明细）
      - name: Dump build log to ci-debug issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/ci-debug-dump.sh "macos build" "/tmp/macos-build.log"

      - name: Run tests (ctest, auto-retry once)
        run: |
          # --timeout 240：单测超时护栏——macOS ctest 曾长期挂死无结论
          #（2026-09-04 实证，>25min 仍 in_progress）。
          # 瞬态 flaky（corekern_deep 2026-09-05 实证：macOS runner 慢负载下
          # 定时敏感单测首轮偶发红、同环境 rerun-failed 即全过）经一次自动
          # 重试吸收；真实回归 rerun 仍失败 → fail-closed（exit rc2）。门禁
          # 口径：首轮失败但 rerun-failed 全过视为 flaky 放行，明细留档。
          set +e
          ctest --test-dir ${{ env.BUILD_DIR }} --output-on-failure -j"$(sysctl -n hw.ncpu)" \
            --timeout 240 > /tmp/macos-ctest.log 2>&1
          rc=$?
          if [ $rc -eq 0 ]; then
            exit 0
          fi
          echo "::error::macOS ctest FAILED rc=$rc (attempt 1)，自动 rerun-failed…"
          grep -E 'The following tests FAILED:|Test #|Passed|Failed|\*\*\*|Timeout|Subprocess aborted' \
            /tmp/macos-ctest.log | sed 's/^/::error::  /' | head -50
          tail -n 20 /tmp/macos-ctest.log | sed 's/^/::error::  /'
          ctest --test-dir ${{ env.BUILD_DIR }} --output-on-failure --rerun-failed \
            --timeout 240 > /tmp/macos-rerun.log 2>&1
          rc2=$?
          if [ $rc2 -eq 0 ]; then
            echo "::warning::macOS ctest attempt1 失败但 rerun-failed 全过（flaky），门禁放行"
            exit 0
          fi
          echo "::error::macOS ctest rerun FAILED rc=$rc2"
          # 断言级失败明细：corekern_deep 2026-09-06 实证 rerun 双败但
          # tail 窗口内全是 PASS 行；全量抓取 [FAIL] 行定位具体断言。
          grep -E '\[FAIL\]' /tmp/macos-rerun.log | head -30 | sed 's/^/::error::  /' || true
          tail -n 40 /tmp/macos-rerun.log | sed 's/^/::error::  /'
          exit $rc2

      # 失败（含 rerun 仍失败）即把首轮与 rerun 日志落 ci-debug issue（公共
      # issue 匿名 API 可读，供排障拉取）；flaky 放行的场景不在此触发
      - name: Dump ctest logs to ci-debug issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          bash .github/scripts/ci-debug-dump.sh "macos ctest" "/tmp/macos-ctest.log"
          if [ -f /tmp/macos-rerun.log ]; then
            bash .github/scripts/ci-debug-dump.sh "macos ctest rerun" "/tmp/macos-rerun.log"
          fi

  # ==================== Windows 跨平台构建门禁 ====================
  windows-build:
    # E3 hosted runner 争抢治理（0.1.11）：windows 腿与 release.yml windows
    # leg 共享 ci-windows-runner-bus，串行防 MSVC 构建双重占满 windows 配额。
    concurrency:
      group: ci-windows-runner-bus
      cancel-in-progress: false
    runs-on: windows-latest
    # 超时护栏（2026-09-04）：同 macOS，防 ctest/构建挂死到 6h
    timeout-minutes: 90
    # G2（0.1.13）达成：windows ctest 失败面自 35 项 SegFault 收敛至全绿
    # （wave-9 Build 连续绿 → wave-13d 三腿 ctest 全绿：#134 五失败经 join
    # retval / create 非递归 trylock / depgraph 栈 reserve / yaml AIRY_FREE
    # 与 macOS 时间戳确定性逐项修复归零）。移出 continue-on-error，本 job
    # 恢复为 required 门禁；Windows 完整产品（daemons 15 + airy_cli）构建
    # 链持续绿，release.yml windows leg 以 publish REQUIRED_BIN 预检为
    # 入 needs 判据。
    env:
      # BAN-33：构建目录位于源码树外（工作区上级目录）
      BUILD_DIR: ../build
    steps:
      # 同 linux job：checkout 独立远程首步 + lf-init-deps 定向检出
      # （#103 实证：本地 composite 无法在内部自举 checkout）。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
      - name: Init submodules (targeted)
        uses: ./.github/actions/lf-init-deps
        with:
          groups: agent-workload
          gh_token: ${{ secrets.GH_TOKEN }}

      # E4：vcpkg 二进制缓存恢复（须在 install 之前；key 随 workflow 内容变化
      # 自动失效并回退前缀 key；加性缓存由 vcpkg 自身保证正确性）
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-cache-${{ runner.os }}-${{ hashFiles('.github/workflows/build-test.yml') }}
          restore-keys: |
            vcpkg-cache-${{ runner.os }}-

      - name: Install dependencies (vcpkg)
        shell: pwsh
        # E4：vcpkg 二进制缓存。runner.temp 只能在 step 级 env 解析（job 级 env
        # 无 runner context，GitHub 判整个 workflow 无效——0.1.11 实证）。
        # 命中缓存复用已编译 port；未命中照常编译写回（classic 加性缓存安全）。
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ runner.temp }}/vcpkg-cache,readwrite"
        run: |
          # vcpkg 包名：curl（port 名为 curl 而非 libcurl）；
          # GNU libmicrohttpd 与 libwebsockets 的 port 名带 lib- 前缀，
          # 旧写法 microhttpd/websockets/libcurl 会直接 vcpkg install 失败（Windows 构建阻塞）
          vcpkg install sqlite3 cjson libyaml curl openssl zlib libmicrohttpd libwebsockets libevent --triplet x64-windows

      - name: Configure (MSVC)
        shell: pwsh
        # G1 stage-1（0.1.13）：Windows 完整产品移植的编译数据集采集。默认
        # 矩阵（umbrella WIN32 分支）仍关 daemons/CLI，本腿显式 opt-in 打开
        # 全部 daemon（15 服务）+ airy_cli，把 continue-on-error 转成 MSVC
        # 逐轮 triage 列表（错误 → 修复 → 提交，随 push 自动回归）；产品面
        # 全绿后再升 gate 判据（publish REQUIRED_BIN）。测试面沿用 P25
        # 整目标守卫（daemon 链测试 Windows 不编译）。
        # G2（0.1.13）：PDB 符号注入——直接覆盖 CMAKE_C_FLAGS_RELEASE 会连默认
        # 优化标志一起换掉，造成与既有轮次编译语义漂移（orchestrator.c C4702
        # 曾因此暴露）；CMAKE_MSVC_DEBUG_INFORMATION_FORMAT 在默认 Release
        # 标志之上加 /Zi + /DEBUG，产物带 PDB 且不改优化。windows ctest
        # SegFault（#127）无符号栈只有裸偏移（test_heapstore_core+0x4e99），
        # cdb .ecxr + k 带 PDB 直接落函数名一次定位根因。
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DBUILD_TESTS=ON -DAIRY_BUILD_ALL=ON -DBUILD_DAEMON=ON -DBUILD_CLI=ON `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=ProgramDatabase

      - name: Build
        shell: pwsh
        run: |
          # MSVC 编译失败时把错误以 ::error:: 上报为 annotation（匿名 API 可读）；
          # 与 release.yml windows job 同款合并消息模式
          $buildLog = Join-Path $env:RUNNER_TEMP "build.log"
          cmake --build "${{ env.BUILD_DIR }}" --config Release --parallel 2>&1 | Tee-Object -FilePath $buildLog
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content $buildLog
            # C2220 的前一行即被升级的 warning（含真实告警码），一并纳入
            $errIdx = 0..($lines.Count - 1) | Where-Object { $lines[$_] -match ': error |error C[0-9]+|fatal error|error LNK[0-9]+' }
            $errs = foreach ($i in $errIdx) { $lines[[Math]::Max(0, $i - 1)..$i] }
            $tail = if ($errs) { $errs | Select-Object -Last 40 } else { $lines | Select-Object -Last 60 }
            $msg = ("MSVC build failed (exit {0})`n{1}" -f $LASTEXITCODE, ($tail -join "`n"))
            if ($msg.Length -gt 30000) { $msg = $msg.Substring($msg.Length - 30000) }
            $msg = $msg.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error::$msg"
            exit $LASTEXITCODE
          }

      # 失败即把完整编译日志落 ci-debug issue（公共 issue 匿名 API 可读）
      - name: Dump build log to ci-debug issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/ci-debug-dump.sh "windows build" "$RUNNER_TEMP/build.log"

      - name: Run tests (ctest)
        shell: pwsh
        run: |
          $ctestLog = Join-Path $env:RUNNER_TEMP "ctest.log"
          ctest --test-dir ${{ env.BUILD_DIR }} -C Release --output-on-failure --timeout 240 2>&1 | Tee-Object -FilePath $ctestLog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # G2（0.1.13）：ctest SegFault 栈捕获（cdb）。windows runner 带
      # Windows SDK Debugging Tools 时，对首个失败测试类跑 cdb，crash 断点
      # 上 .ecxr + k 输出符号化调用栈，整段落 ci-debug issue —— SegFault 只
      # 有 "***Exception: SegFault" 无法定位，需真实调用栈逐平台域修。
      # 仅失败时触发；runner 无 cdb 则静默跳过（记录说明），不阻塞门禁。
      - name: Triage ctest crash stacks (cdb)
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # 健壮性：任何一步失败都不阻塞收集与 dump；本步固定 exit 0。
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP "ctest-triage.log"
          "triage start $(Get-Date -Format o)" | Out-File -FilePath $log -Encoding utf8
          $cdb = @(
            'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe',
            'C:\Program Files\Windows Kits\10\Debuggers\x64\cdb.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          $bdir = (Resolve-Path $env:BUILD_DIR).Path
          if (-not $cdb) {
            "cdb not found on runner - skip stack capture" | Add-Content $log
          } else {
            # 从 ctest rerun-failed 记录解析失败测试名 → 反推可执行文件：
            # ctest 注册名带 commons_test_ 前缀（对应 exe test_platform 等，
            # #127 实证 hardcode candidates 用 ctest 名找不到 exe，只抓到
            # heapstore），atoms/cupolas/heapstore/taskflow 的 ctest 名即 exe 名。
            $names = @()
            try {
              $names = @(& ctest --test-dir $env:BUILD_DIR -C Release --rerun-failed -N 2>&1 |
                ForEach-Object {
                  if ($_ -match 'Test\s+#\d+:\s+(\S+)') { $matches[1] }
                } | Select-Object -Unique)
            } catch {
              "ctest rerun-failed -N failed: $($_.Exception.Message)" | Add-Content $log
            }
            "failed test names: $($names -join ', ')" | Add-Content $log
            $exes = @()
            foreach ($name in $names) {
              $base = $name -replace '^commons_test_', ''
              # exe 名可能带目标名前缀（如 corekern_kernel_state / cupolas_core_tests），
              # 用后缀匹配放宽查找（heapstore/taskflow 目标名即测试名，直接命中）。
              $found = Get-ChildItem $bdir -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue |
                Where-Object { $_.BaseName -eq $base -or $_.BaseName.EndsWith($base) } |
                Select-Object -First 1
              if ($found) { $exes += $found }
            }
            if ($exes.Count -gt 4) { $exes = $exes[0..3] }
            if ($exes.Count -eq 0) {
              "no failing test exe found from rerun-failed - fall back to heapstore_core" |
                Add-Content $log
              $found = Get-ChildItem $bdir -Recurse -Filter 'test_heapstore_core.exe' -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($found) { $exes = @($found) }
            }
            foreach ($exe in $exes) {
              "===== cdb: $($exe.Name) =====" | Add-Content $log
              try {
                # 经典 cdb 自动化：初断处 -c 先 g 跑到 crash 断点，再 .ecxr + k。
                # Release + ProgramDatabase 产物带 PDB，栈可直接落到函数名。
                & $cdb -o -c "g; .ecxr; k 40; q" $exe.FullName 2>&1 | Add-Content $log
              } catch {
                "cdb run failed for $($exe.Name): $($_.Exception.Message)" | Add-Content $log
              }
            }
          }
          "triage done $(Get-Date -Format o)" | Add-Content $log
          # 无论是否拿到栈都整段落 ci-debug issue（无栈也有排查说明）；
          # exit 0 保证该步骤不额外报红。
          bash .github/scripts/ci-debug-dump.sh "windows ctest triage" $log
          exit 0
      - name: Rerun failed tests & dump to ci-debug issue
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          $rerunLog = Join-Path $env:RUNNER_TEMP "ctest-rerun.log"
          ctest --test-dir ${{ env.BUILD_DIR }} -C Release --output-on-failure --rerun-failed --timeout 240 2>&1 | Tee-Object -FilePath $rerunLog
          bash .github/scripts/ci-debug-dump.sh "windows ctest rerun" $rerunLog

  # ==================== MemoryRovol 独立构建门禁（OSS + PRO） ====================
  # 禁用：memoryrovol 为闭源仓（.gitmodules update=none，GitHub 不存在，
  # 仅 atomgit 私有可达），GitHub Actions 无法检出源码；旧路径
  # products/memoryrovol 亦为拆分前布局（现 agent-workload/products/）。
  # 该门禁由本地构建台执行（tools/scripts/ci 体系），不在 GitHub 镜像侧运行。
  memoryrovol-build:
    if: false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [oss, pro]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake lcov libsqlite3-dev libcjson-dev libyaml-dev \
            libcurl4-openssl-dev libssl-dev zlib1g-dev libzstd-dev

      - name: Configure (${{ matrix.mode }})
        run: |
          if [ "${{ matrix.mode }}" = "oss" ]; then
            CMAKE_EXTRA="-DMEMORYROVOL_OSS=ON"
          fi
          cmake -S agent-workload/products/memoryrovol -B build \
            -DBUILD_TESTS=ON -DWARNINGS_AS_ERRORS=ON ${CMAKE_EXTRA}

      - name: Build
        run: |
          cmake --build build --parallel "$(nproc)"

      - name: Run tests (ctest)
        run: |
          ctest --test-dir build --output-on-failure
